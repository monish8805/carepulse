server {
    listen 8080;
    root /usr/share/nginx/html;

    # nginx drops server-level add_header lines in any location that sets its own,
    # so the security headers are repeated in each location below.

    # Vite fingerprints everything in /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # SPA mode: TanStack Start emits _shell.html as the page every route boots from.
    # Never cache it, or a deploy would keep serving old asset names.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /_shell.html;
    }
}
