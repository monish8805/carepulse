name: Publish images

# Pull requests only prove the images still build. Images are pushed to GHCR from
# main, and only after the CI workflow has passed for that commit, so a red commit
# never becomes an image. After a push's images are published, the deploy job below hands
# that commit to deploy.yml (only once the repository variable DEPLOY_ENABLED is "true").
on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # Public URL baked into the frontend bundles. Set the repository variable
  # VITE_API_URL to the real backend URL once there is one; until then the images
  # target a backend on localhost:5001.
  VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:5001' }}

jobs:
  images:
    name: ${{ matrix.name }}
    # workflow_run fires for every CI run: only continue for a green push to main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: ml-service
            context: ml-service
            file: ml-service/Dockerfile
          - name: patient-frontend
            context: .
            file: docker/frontend.Dockerfile
            app: patient-frontend
          - name: hospital-frontend
            context: .
            file: docker/frontend.Dockerfile
            app: hospital-frontend
          - name: owner-frontend
            context: .
            file: docker/frontend.Dockerfile
            app: owner-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # Pull requests (including from forks) get a read-only token and must not push.
      - id: target
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/carepulse-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_run" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.target.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=latest,enable=${{ steps.target.outputs.push == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_API_URL=${{ env.VITE_API_URL }}
            GIT_SHA=${{ env.SHA }}
          push: ${{ steps.target.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy
    needs: images
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
