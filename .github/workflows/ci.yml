name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      backend-tests:
        description: "Also run the backend test suite (uses the real MongoDB Atlas dev database and Brevo)"
        type: boolean
        default: false

jobs:
  frontend:
    name: ${{ matrix.app }} — typecheck, lint, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [patient-frontend, hospital-frontend, owner-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # One install for every workspace (apps, packages/, e2e) from the root lockfile.
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: ${{ matrix.app }}
      - run: npx eslint
        working-directory: ${{ matrix.app }}
      - run: npx vite build
        working-directory: ${{ matrix.app }}

  packages:
    name: packages — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type errors in packages/ are caught by each app's tsc, which compiles them.
      - run: npm run lint:packages

  e2e:
    name: End-to-end (Playwright, fake backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Starts the three dev servers itself (see playwright.config.ts); every
      # backend call is faked in the browser, so no secrets are needed.
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  backend-build:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.build.json --noEmit

  # The backend suite hits the real Atlas dev database and the real Brevo API
  # (deliberately — see CLAUDE.md), so it only runs when asked for manually and
  # needs these repository secrets: MONGODB_URI, JWT_SECRET, BREVO_API_KEY,
  # BREVO_SENDER_EMAIL, BREVO_SENDER_NAME.
  backend-tests:
    name: Backend — tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
      ALLOWED_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:3003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
